<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="45%" stop-color="#4C8DFF" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="favOrbit" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="60%" stop-color="#4C8DFF" />
      <stop offset="100%" stop-color="#9333EA" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect width="64" height="64" rx="14" fill="#070B12" />
  <rect width="62" height="62" x="1" y="1" rx="13" stroke="#202A38" stroke-width="1" />

  <!-- Monogram & Orbit Scaled -->
  <g transform="translate(11, 11) scale(0.35)">
    <!-- Back Orbit -->
    <path d="M 125,75 C 135,50 115,35 85,40" stroke="url(#favOrbit)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- 'I' Column -->
    <rect x="15" y="25" width="20" height="90" rx="3" fill="url(#favGrad)" />

    <!-- 'R' Structure -->
    <rect x="43" y="25" width="20" height="90" rx="3" fill="url(#favGrad)" />
    <path d="M 63,25 L 98,25 C 118,25 128,38 128,55 C 128,72 116,84 96,84 L 63,84 Z" fill="url(#favGrad)" />
    <path d="M 63,42 L 94,42 C 103,42 108,47 108,55 C 108,62 103,67 94,67 L 63,67 Z" fill="#070B12" />
    <path d="M 84,80 L 112,115 L 132,115 L 102,78 Z" fill="url(#favGrad)" />

    <!-- Analytics Bars -->
    <rect x="48" y="96" width="5" height="19" rx="1.5" fill="#00F0FF" />
    <rect x="56" y="90" width="5" height="25" rx="1.5" fill="#38BDF8" />
    <rect x="64" y="82" width="5" height="33" rx="1.5" fill="#60A5FA" />
    <rect x="72" y="74" width="5" height="41" rx="1.5" fill="#818CF8" />

    <!-- Front Orbit -->
    <path d="M 0,86 C 10,108 55,118 100,100 C 130,86 142,66 138,58" stroke="url(#favOrbit)" stroke-width="6" stroke-linecap="round" fill="none" />
    <circle cx="106" cy="94" r="7" fill="#00F0FF" />
    <circle cx="106" cy="94" r="3.5" fill="#FFFFFF" />
  </g>
</svg>