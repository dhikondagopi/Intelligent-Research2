<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%" fill="none">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="irPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="45%" stop-color="#4C8DFF" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <linearGradient id="irTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#4C8DFF" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="irOrbitGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#4C8DFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#9333EA" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="irLineGradLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4C8DFF" stop-opacity="0" />
      <stop offset="100%" stop-color="#4C8DFF" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="irLineGradRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4C8DFF" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#4C8DFF" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="irGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Optional Background: Transparent or Dark -->
  <g id="ir-brand-lockup">
    <!-- MONOGRAM SYMBOL GROUP (X: 50 to 180, Y: 60 to 220) -->
    <g id="ir-symbol" transform="translate(45, 50)">
      <!-- Back Section of Orbital Ring -->
      <path 
        d="M 125,75 C 135,50 115,35 85,40" 
        stroke="url(#irOrbitGrad)" 
        stroke-width="3" 
        stroke-linecap="round"
        fill="none" 
        opacity="0.6"
      />

      <!-- 'I' STEM & Analytics Bars -->
      <!-- 'I' Main Column -->
      <path 
        d="M 15,25 L 35,25 L 35,115 L 15,115 Z" 
        fill="url(#irPrimaryGrad)" 
        filter="url(#irGlow)"
      />
      <!-- 'I' Top Highlight Accent -->
      <path 
        d="M 15,25 L 35,25 L 35,32 L 15,32 Z" 
        fill="#E0F7FF" 
        opacity="0.7"
      />

      <!-- 'R' LETTER STRUCTURE -->
      <!-- 'R' Vertical Spine -->
      <path 
        d="M 43,25 L 63,25 L 63,115 L 43,115 Z" 
        fill="url(#irPrimaryGrad)" 
      />
      <!-- 'R' Upper Curved Loop -->
      <path 
        d="M 63,25 L 98,25 C 118,25 128,38 128,55 C 128,72 116,84 96,84 L 63,84 Z" 
        fill="url(#irPrimaryGrad)" 
      />
      <!-- 'R' Inner Counter Cutout -->
      <path 
        d="M 63,42 L 94,42 C 103,42 108,47 108,55 C 108,62 103,67 94,67 L 63,67 Z" 
        fill="#070B12" 
      />
      <!-- 'R' Diagonal Leg with dimensional cut -->
      <path 
        d="M 84,80 L 112,115 L 132,115 L 102,78 Z" 
        fill="url(#irPrimaryGrad)" 
      />

      <!-- ASCENDING ANALYTICS DATA BARS (Integrated in lower negative space) -->
      <rect x="47" y="96" width="5" height="19" rx="1.5" fill="#00F0FF" opacity="0.9" />
      <rect x="55" y="90" width="5" height="25" rx="1.5" fill="#38BDF8" opacity="0.95" />
      <rect x="63" y="82" width="5" height="33" rx="1.5" fill="#60A5FA" />
      <rect x="71" y="74" width="5" height="41" rx="1.5" fill="#818CF8" />

      <!-- FRONT ORBITAL RIBBON & TRAJECTORY -->
      <path 
        d="M 0,86 C 10,108 55,118 100,100 C 130,86 142,66 138,58" 
        stroke="url(#irOrbitGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round"
        fill="none" 
      />
      <!-- Orbit Inner Specular Highlight Ribbon -->
      <path 
        d="M 8,87 C 22,106 62,114 98,99" 
        stroke="#FFFFFF" 
        stroke-width="1.5" 
        stroke-linecap="round"
        fill="none" 
        opacity="0.8"
      />

      <!-- GLOWING SPHERE / ORBITAL DATA NODE -->
      <circle cx="106" cy="94" r="5" fill="#00F0FF" filter="url(#dotGlow)" />
      <circle cx="106" cy="94" r="2.5" fill="#FFFFFF" />
    </g>

    <!-- TYPOGRAPHY GROUP (Right Side) -->
    <g id="ir-typography" transform="translate(210, 115)">
      <!-- Brand Name: Intelligent Research -->
      <text x="0" y="24" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.02em">
        <tspan fill="#FFFFFF">Intelligent </tspan>
        <tspan fill="url(#irTextGrad)">Research</tspan>
      </text>

      <!-- Subtitle Row: RESEARCH & INNOVATION PLATFORM -->
      <g transform="translate(0, 52)">
        <!-- Left Horizontal Accent Line -->
        <line x1="0" y1="-5" x2="36" y2="-5" stroke="url(#irLineGradLeft)" stroke-width="1.5" />
        
        <!-- Subtitle Text -->
        <text x="46" y="0" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#98A4B5" letter-spacing="0.22em">
          RESEARCH &amp; INNOVATION PLATFORM
        </text>

        <!-- Right Horizontal Accent Line -->
        <line x1="335" y1="-5" x2="375" y2="-5" stroke="url(#irLineGradRight)" stroke-width="1.5" />
      </g>
    </g>
  </g>
</svg>
