# docker-compose.yml
# Local development orchestration for Intelligent-Research2
# Production deployments use Render (backend) + Vercel (frontend).
#
# Usage:
#   cp backend/.env.example backend/.env   # fill in secrets
#   docker compose up --build

services:

  # Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: irp_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      PORT: 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    networks:
      - irp_net

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: irp_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - irp_net

networks:
  irp_net:
    driver: bridge