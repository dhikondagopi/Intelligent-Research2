# docker-compose.yml
# Local development orchestration for Intelligent-Research2
# Production deployments use Render (backend) + Vercel (frontend).
#
# Usage:
#   cp backend/.env.example backend/.env   # fill in secrets
#   docker compose up --build

services:

  # -- Backend ----------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: irp_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Mongo
      MONGO_URI: ${MONGO_URI}
      DATABASE_NAME: ${DATABASE_NAME:-intelligent_research}
      # JWT
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      # CORS – allow the local frontend container
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:80,http://localhost:3000}
      # USPTO (optional)
      USPTO_API_KEY: ${USPTO_API_KEY:-}
      # Uvicorn port
      PORT: 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    networks:
      - irp_net

  # -- Frontend ---------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Tells the Vite build to point at the backend container on the host
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: irp_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - irp_net

networks:
  irp_net:
    driver: bridge
